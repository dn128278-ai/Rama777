name: Build RAMA77 Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Extract Uploaded ZIP File
      run: |
        echo "Searching for project zip..."
        ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Found ZIP file: $ZIP_FILE. Extracting..."
          unzip -o "$ZIP_FILE" -d temp_extract
          GRADLEW_PATH=$(find temp_extract -name "gradlew" | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            SRC_DIR=$(dirname "$GRADLEW_PATH")
            shopt -s dotglob
            cp -rn "$SRC_DIR"/* .
          else
            shopt -s dotglob
            cp -rn temp_extract/* .
          fi
          rm -rf temp_extract
        fi

    - name: Build Debug APK
      run: |
        if [ -f "./gradlew" ]; then
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --continue
        else
          echo "Gradle wrapper missing, initializing..."
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --continue
        fi

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: RAMA77-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
