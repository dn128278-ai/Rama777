name: Build RAMA77 Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Extract and Structure Project Files
      run: |
        echo "Searching for project zip..."
        ZIP_FILE=$(find . -maxdepth 3 -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Found ZIP file: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d temp_zip
          BUILD_FILE=$(find temp_zip -name "build.gradle*" | head -n 1)
          if [ -n "$BUILD_FILE" ]; then
            PROJECT_ROOT=$(dirname "$BUILD_FILE")
            echo "Moving files from $PROJECT_ROOT to current directory..."
            shopt -s dotglob
            cp -rn "$PROJECT_ROOT"/* .
            rm -rf temp_zip
          fi
        fi

    - name: Setup Gradle Wrapper
      run: |
        if [ -f "gradlew" ]; then
          chmod +x gradlew
        else
          echo "Gradle wrapper missing, generating..."
          gradle wrapper
          chmod +x gradlew
        fi

    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug --stacktrace --continue

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: RAMA77-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
